<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Halo -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Orbital Ring 1 Gradient -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Orbital Ring 2 Gradient -->
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Center Geometric Facet Gradients -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#haloGrad)"/>

  <!-- Orbital Ring 1: Primary Outer Arc (Tilted Ellipse) -->
  <ellipse cx="256" cy="256" rx="210" ry="95" transform="rotate(-28 256 256)"
           fill="none" stroke="url(#orbitGrad1)" stroke-width="2.5" stroke-dasharray="16 8 38 12 70 14" opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Orbital Ring 2: Secondary Counter Arc -->
  <ellipse cx="256" cy="256" rx="190" ry="80" transform="rotate(42 256 256)"
           fill="none" stroke="url(#orbitGrad2)" stroke-width="2.2" stroke-dasharray="24 10 50 16" opacity="0.8"/>

  <!-- Orbital Ring 3: Inner Fast Gyro Ring -->
  <ellipse cx="256" cy="256" rx="145" ry="60" transform="rotate(-65 256 256)"
           fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="8 6 22 8" opacity="0.75"/>

  <!-- Orbital Satellite Nodes -->
  <circle cx="95" cy="180" r="4.5" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="410" cy="325" r="4.0" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="340" cy="130" r="3.5" fill="#38bdf8"/>
  <circle cx="165" cy="385" r="3.5" fill="#00f0ff"/>

  <!-- Luminous Energy Core Background -->
  <circle cx="256" cy="256" r="82" fill="url(#coreGlow)" filter="url(#neonGlow)"/>

  <!-- Outer Geometric Hexagonal Frame -->
  <polygon points="256,155 338,202 338,296 256,343 174,296 174,202"
           fill="#090d1a" fill-opacity="0.82" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Inner Geometric Tech Crosshairs -->
  <line x1="256" y1="135" x2="256" y2="155" stroke="#00f0ff" stroke-width="2"/>
  <line x1="256" y1="343" x2="256" y2="363" stroke="#00f0ff" stroke-width="2"/>
  <line x1="154" y1="249" x2="174" y2="249" stroke="#00f0ff" stroke-width="2"/>
  <line x1="338" y1="249" x2="358" y2="249" stroke="#00f0ff" stroke-width="2"/>

  <!-- Central Futuristic Geometric Prism 'M' Mark -->
  <!-- Left Wing -->
  <polygon points="196,285 224,198 244,248 222,298" fill="url(#facetLeft)" opacity="0.95"/>

  <!-- Center Apex Core -->
  <polygon points="244,248 256,220 268,248 256,278" fill="url(#facetCenter)" filter="url(#neonGlow)"/>

  <!-- Right Wing -->
  <polygon points="316,285 288,198 268,248 290,298" fill="url(#facetRight)" opacity="0.95"/>

  <!-- Bottom Core Crystal Anchor -->
  <polygon points="256,278 244,248 268,248" fill="#ffffff" opacity="0.9"/>
  <polygon points="256,278 222,298 256,318 290,298" fill="#0284c7" fill-opacity="0.7" stroke="#00f0ff" stroke-width="1.2"/>
</svg>
